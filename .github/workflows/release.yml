name: Release Launcher

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Build UI
        working-directory: launcher/ui
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build

      - name: Build launcher
        working-directory: launcher/src-tauri
        run: cargo build --release

      - name: Prepare artifact
        shell: pwsh
        run: Copy-Item "launcher/src-tauri/target/release/quasar-launcher.exe" "QuasarLauncher.exe"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create "$tag" --title "$tag" --notes "Обновление лаунчера $tag" QuasarLauncher.exe
