[package]
name = "quasar-launcher"
version = "0.6.1"
description = "Quasar Launcher"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
base64 = "0.22"
walkdir = "2"
hex = "0.4"
anyhow = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time"] }
md-5 = "0.10"

[profile.release]
strip = true
lto = true
